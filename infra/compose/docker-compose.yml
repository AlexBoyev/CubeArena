services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to localhost only — the api container reaches this over the internal
      # compose network as "postgres:5432" regardless, so nothing about that changes.
      # This just means Postgres itself is never reachable from the LAN or, worse, the
      # internet if this host's ports ever get forwarded (see docs/HOSTING.md) — there
      # was never a reason for it to be reachable from outside this machine at all.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?AUTH_SIGNING_KEY must be set in .env}
      Tickets__SigningKeyPem: ${TICKET_SIGNING_KEY_PEM:?TICKET_SIGNING_KEY_PEM must be set in .env}
      Fleet__ApiKey: ${FLEET_API_KEY:?FLEET_API_KEY must be set in .env}
      LAN_MODE: ${LAN_MODE:-false}
    ports:
      - "${API_PORT:-8080}:8080"
    # No curl/wget in the base aspnet runtime image, so this checks the port itself
    # accepts a connection via bash's built-in /dev/tcp rather than pulling in a new
    # package just for a healthcheck — weaker than hitting /health/ready directly, but
    # enough to tell "the process is up and listening" from "it crashed on boot" in
    # `docker compose ps`.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Tier 0 (docs/HOSTING.md): the dedicated game server, using the same image
  # gameserver.yml builds and pushes to GHCR in CI. Behind a profile (not
  # started by a bare `docker compose up`) because it needs either GHCR pull
  # access to that (currently private) package, or a Linux host that can
  # build infra/docker/Dockerfile.gameserver locally — neither is true by
  # default on a Windows dev box, which instead runs the dedicated server as
  # a native process (see docs/HOSTING.md's Tier 0 runbook). Use this
  # service directly with `docker compose --profile docker-gameserver up -d`
  # once the GHCR package is public, or on a Linux host.
  gameserver:
    image: ghcr.io/alexboyev/cubearena-gameserver:latest
    profiles: ["docker-gameserver"]
    restart: unless-stopped
    depends_on:
      - api
    environment:
      CUBEARENA_BACKEND_URL: http://api:8080
      CUBEARENA_FLEET_API_KEY: ${FLEET_API_KEY:?FLEET_API_KEY must be set in .env}
      # The host address returned to clients via /sessions/quickplay — must be
      # reachable by whoever's joining, so it's your machine's LAN IP for a
      # LAN party, not "localhost" or a container-internal name.
      CUBEARENA_ADVERTISE_HOST: ${PUBLIC_HOST:?PUBLIC_HOST must be set in .env (your machine's LAN IP) — see docs/HOSTING.md Tier 0}
      CUBEARENA_LISTEN_PORT: ${GAMESERVER_PORT:-7777}
      CUBEARENA_CAPACITY: 6
    ports:
      - "${GAMESERVER_PORT:-7777}:7777/udp"

volumes:
  postgres-data:
