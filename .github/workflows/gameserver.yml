name: Game Server

# Requires UNITY_LICENSE (and UNITY_EMAIL/UNITY_PASSWORD, or UNITY_SERIAL for Pro)
# repo secrets before this can actually run — see game-ci.org/docs/github/activation.
# Until then, the job below skips itself (rather than failing) so this
# workflow doesn't sit permanently red on a check nobody can fix without
# those secrets.

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "infra/docker/Dockerfile.gameserver"
      - ".github/workflows/gameserver.yml"
  pull_request:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "infra/docker/Dockerfile.gameserver"
      - ".github/workflows/gameserver.yml"

jobs:
  # Secrets can't be referenced directly in a job's `if:` (GitHub Actions
  # rejects the expression outright), so resolve presence into a step
  # output here first, where `run:` can see secrets, then gate the real
  # job on that output.
  check-license:
    runs-on: ubuntu-latest
    outputs:
      has-license: ${{ steps.check.outputs.has-license }}
    steps:
      - id: check
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "has-license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-license=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

  build-linux-server:
    needs: check-license
    if: needs.check-license.outputs.has-license == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-LinuxServer-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-LinuxServer-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.5f1
          targetPlatform: StandaloneLinux64
          buildMethod: BuildScript.BuildLinuxDedicatedServer
          buildsPath: Builds/LinuxServer

      # GHCR requires a lowercase repository name; github.repository_owner
      # preserves the account's actual casing, which Docker rejects.
      - name: Compute lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.gameserver
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/cubearena-gameserver:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/cubearena-gameserver:${{ github.sha }}
