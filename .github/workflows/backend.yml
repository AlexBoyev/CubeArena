name: Backend

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore CubeArena.sln
      - run: dotnet build CubeArena.sln --no-restore -c Release
      - run: dotnet test CubeArena.sln --no-build -c Release
